# =============================================================================
# Prefix: Ctrl+b (default)
# =============================================================================


# =============================================================================
# General
# =============================================================================
set -g mouse on                  # Enable mouse (click panes, scroll, resize)
set -g extended-keys on          # Pass extended key sequences (Shift/Ctrl/Alt combos) to apps
set -g history-limit 10000       # More scrollback history
set -g base-index 1              # Start windows at 1 (not 0)
setw -g pane-base-index 1        # Start panes at 1 (not 0)
set -g renumber-windows on       # Renumber windows when one is closed


# =============================================================================
# Key Bindings
# =============================================================================
# Vim-style pane navigation (no prefix needed after first move)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Intuitive splits (open in current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style copy mode
set -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
